<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login — BlockVote</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=9.0">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-link"></i>
            <h4>BlockVote</h4>
            <p class="text-muted small">Sign in to your account</p>
        </div>

        <div id="alertBox"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user me-1 text-muted"></i>Username or Email</label>
                <input type="text" class="form-control" id="usernameOrEmail" placeholder="Enter username or email" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-lock me-1 text-muted"></i>Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
        </form>

        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
            Don't have an account? <a href="register.html" class="text-primary fw-bold">Register</a>
        </p>
        <p class="text-center mt-2 mb-0">
            <a href="index.html" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Home</a>
        </p>

        <div class="text-center mt-3 pt-2 border-top">
            <span class="badge bg-light text-secondary border px-3 py-2 rounded-pill">
                <i class="fas fa-users me-1 text-primary"></i> Registered Users: <strong class="text-dark ms-1" id="footerRegisteredUsers">0</strong>
            </span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-sync.js"></script>
<script src="js/blockchain.js"></script>
<script src="js/app.js?v=9.0"></script>
<script>
// Redirect if already logged in; show error messages from redirect params
document.addEventListener('DOMContentLoaded', () => {
    const user = AppState.getCurrentUser();
    if (user) {
        window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
        return;
    }

    // Show contextual alerts based on URL params
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const redirect = params.get('redirect');

    if (error === 'admin_required') {
        showAlert('alertBox', '<i class="fas fa-lock me-2"></i><strong>Admin access required.</strong> Please sign in with your admin credentials to continue.', 'warning');
    } else if (error === 'session_expired') {
        showAlert('alertBox', '<i class="fas fa-clock me-2"></i>Your session has expired. Please sign in again.', 'info');
    } else if (error === 'login_required') {
        showAlert('alertBox', '<i class="fas fa-sign-in-alt me-2"></i>Please sign in to access that page.', 'info');
    }

    // Pre-fill redirect destination so login goes back to intended page
    if (redirect) {
        document.getElementById('loginForm').dataset.redirect = redirect;
    }
});

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('usernameOrEmail').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

    setTimeout(() => {
        const user = AppState.login(username, password);
        if (user) {
            // Restore wallet if stored
            const wallet = AppState.getWallet() || user.walletAddress;
            if (wallet) AppState.connectWallet(wallet);

            showAlert('alertBox', '<i class="fas fa-check-circle me-2"></i>Welcome back, <strong>' + user.username + '</strong>! Redirecting...', 'success');
            setTimeout(() => {
                // Respect redirect param (e.g. admin page), fallback to role-based default
                const form = document.getElementById('loginForm');
                const redirectTo = form.dataset.redirect;
                if (redirectTo) {
                    window.location.href = redirectTo + '.html';
                } else {
                    window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
                }
            }, 1000);
        } else {
            showAlert('alertBox', '<i class="fas fa-exclamation-triangle me-2"></i>Invalid credentials. Please try again.', 'danger');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In';
        }
    }, 500);
});

function togglePwd() {
    const el = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    el.type = el.type === 'password' ? 'text' : 'password';
    icon.className = el.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}
</script>
</body>
</html>
