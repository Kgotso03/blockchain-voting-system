<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BlockVote</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=7.0">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-link"></i>
            <h4>BlockVote</h4>
            <p class="text-muted small">Sign in to your account</p>
        </div>

        <div id="alertBox"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user me-1 text-muted"></i>Username or Email</label>
                <input type="text" class="form-control" id="usernameOrEmail" placeholder="Enter username or email" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-lock me-1 text-muted"></i>Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
        </form>

        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
            Don't have an account? <a href="register.html" class="text-primary fw-bold">Register</a>
        </p>
        <p class="text-center mt-2 mb-0">
            <a href="index.html" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Home</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-sync.js"></script>
<script src="js/blockchain.js"></script>
<script src="js/app.js"></script>
<script>
// Redirect if already logged in
document.addEventListener('DOMContentLoaded', () => {
    const user = AppState.getCurrentUser();
    if (user) {
        window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
    }
});

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('usernameOrEmail').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

    setTimeout(() => {
        const user = AppState.login(username, password);
        if (user) {
            // Restore wallet if stored
            const wallet = AppState.getWallet() || user.walletAddress;
            if (wallet) AppState.connectWallet(wallet);

            showAlert('alertBox', '<i class="fas fa-check-circle me-2"></i>Welcome back, <strong>' + user.username + '</strong>! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
            }, 1000);
        } else {
            showAlert('alertBox', '<i class="fas fa-exclamation-triangle me-2"></i>Invalid credentials. Please try again.', 'danger');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In';
        }
    }, 500);
});

function togglePwd() {
    const el = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    el.type = el.type === 'password' ? 'text' : 'password';
    icon.className = el.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}
</script>
</body>
</html>
